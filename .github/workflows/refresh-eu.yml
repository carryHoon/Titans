name: Refresh Euronext market-cap stats

# Euronext(파리/암스테르담/밀라노) 시총 기준값(/statistics) 스냅샷을 Upstash에 갱신한다.
# 라우트가 quote 있는 종목은 라이브 스케일링하므로 여기선 시총 base(≈전일 종가)만 하루 1회 받는다.
on:
  schedule:
    # 18:00 UTC 평일 — Euronext 정규장 마감(17:30 CET = 16:30 UTC 겨울 / 15:30 UTC 여름) 후.
    - cron: '0 18 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: refresh-eu-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 65종목 × 2.5s ≈ 2.7분 (+ 재시도) → 여유
    defaults:
      run:
        working-directory: titans-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: titans-web/package-lock.json

      - run: npm ci

      - name: Refresh eu-stats snapshot
        run: npm run refresh:eu
        env:
          TWELVE_DATA_API_KEY:      ${{ secrets.TWELVE_DATA_API_KEY }}
          UPSTASH_REDIS_REST_URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
