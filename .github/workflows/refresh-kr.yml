name: Refresh KR snapshot

# 코스피/코스닥 종목시총 + 지수(코스피·코스닥·KRX300·KRX반도체) 스냅샷 갱신 알람(무료 스케줄러).
# 두 데이터는 하나의 스냅샷에 함께 묶여(refreshIfNew) 같은 트리거로 갱신되므로 이 크론 하나로 통일된다.
#
# 공공데이터포털 금융위원회 API 공식 갱신 기준(주식시세정보·지수시세정보 동일):
#   "데이터 갱신주기는 일 1회. 기준일자(basDt)로부터 영업일 하루 뒤 오후 1시(KST) 이후 업데이트.
#    예) 금요일 데이터는 차주 월요일 제공(월요일이 공휴일이면 다음 영업일)."
# → 새 데이터는 '영업일(월~금) 13:00 KST 이후'에만 등장하고, 주말엔 아무것도 안 올라온다.
#   따라서 영업일 오후만 조준하고 주말은 폴링하지 않는다. 공휴일은 GH가 알 수 없지만, 그날 핑은
#   새 데이터가 없어 refreshIfNew가 no-op(updated:false)이라 무해하고, 실제 발행일에 자연히 잡힌다.

on:
  schedule:
    # cron은 UTC 기준. KST = UTC+9 → 13:00~21:00 KST = 04:00~12:00 UTC (날짜 넘김 없음, 요일 동일).
    # 월~금(1-5) 매시 정각. 13시 정각부터 커버하되(발행 13:xx면 14시 핑이 잡음) 이례적 지연 발행도
    # 당일 취득하도록 21시까지 넉넉히. GH Actions 크론 지연/누락 대비 시간별 중복.
    - cron: '0 4-12 * * 1-5'
  workflow_dispatch: {}   # 필요할 때 수동 실행(Actions 탭 버튼)

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ping refresh endpoint
        run: |
          curl -fsS --max-time 120 -X POST \
            -H "x-refresh-secret: ${{ secrets.REFRESH_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/internal/refresh-kr"
