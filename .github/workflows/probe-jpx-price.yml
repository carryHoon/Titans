name: Probe JPX price (manual)

# JPX 일별 종가 취득 가능성 재프로브(진단 전용, read-only). 스냅샷/Upstash 무관.
# 수동 실행만 — schedule 없음. 로그로 결과 확인.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: titans-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: titans-web/package-lock.json

      - run: npm ci

      - name: Probe JPX price endpoints
        run: npx tsx scripts/probe-jpx-price.ts
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
