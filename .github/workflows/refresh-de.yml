name: Refresh XETRA market-cap stats

# 독일 XETRA(Deutsche Börse) 시총 기준값(/statistics) 스냅샷을 Upstash에 갱신한다.
# 라우트가 quote 있는 종목은 라이브 스케일링하므로 여기선 시총 base(≈전일 종가)만 하루 1회 받는다.
on:
  schedule:
    # 19:00 UTC 평일 — XETRA 정규장 마감(17:30 CET = 16:30 UTC 겨울 / 15:30 UTC 여름) 후.
    # Euronext 크론(18:00 UTC)과 겹치지 않게 stagger(둘 다 /statistics 500크레딧/분이라 동시 실행
    # 시 Venture 610/분 한도 초과 — EU 65종목은 18:07경 종료되므로 19:00은 충분히 여유).
    - cron: '0 19 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: refresh-de-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 39종목 × 6s ≈ 4분 (+ 재시도) → 여유 (gap 6s = /statistics 429 회피)
    defaults:
      run:
        working-directory: titans-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: titans-web/package-lock.json

      - run: npm ci

      - name: Refresh de-stats snapshot
        run: npm run refresh:de
        env:
          TWELVE_DATA_API_KEY:      ${{ secrets.TWELVE_DATA_API_KEY }}
          UPSTASH_REDIS_REST_URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
